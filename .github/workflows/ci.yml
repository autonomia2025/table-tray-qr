# Integración continua de Tablio: cada cambio se revisa, compila y prueba solo.
name: CI

on:
  push:
    branches: [main, "fase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Base de pruebas. Son valores públicos por diseño (van dentro de la app que se publica);
# la seguridad la dan las reglas de la base, no esconder esta clave.
env:
  VITE_SUPABASE_PROJECT_ID: iznwvklzmyhzalabgfxl
  VITE_SUPABASE_URL: https://iznwvklzmyhzalabgfxl.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6bnd2a2x6bXloemFsYWJnZnhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODAyNDMsImV4cCI6MjEwNjQ1NjI0M30.thX4nOQ54k5NZNXdUw4Us--yCtll_Daaj1Qyf1m_pDY

jobs:
  revisar:
    name: Tipos, estilo, compilación y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Crear .env (ya no está en el repositorio)
        run: printf 'VITE_SUPABASE_PROJECT_ID="%s"\nVITE_SUPABASE_URL="%s"\nVITE_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$VITE_SUPABASE_PROJECT_ID" "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env
      - name: Revisión de tipos
        run: bun run typecheck
      - name: Estilo (sin errores nuevos)
        run: bun run lint:tope
      - name: Compilación
        run: bun run build
      - name: Pruebas unitarias
        run: bun run test

  base-desechable:
    name: Seguridad y navegador contra una base desechable
    runs-on: ubuntu-latest
    needs: revisar
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - run: bun install --frozen-lockfile
      - name: Instalar navegador
        run: bunx playwright install --with-deps chromium
      # Supabase local con TODAS las migraciones del repositorio, desde cero.
      - name: Levantar Supabase local
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      # Demo y "Local Ajeno" con contraseñas nuevas; pruebas de seguridad y de navegador.
      # Nada de esto toca la base de pruebas real.
      - name: Pruebas contra la base desechable
        run: bash scripts/pruebas-base-local.sh
      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
