# Igual que en Lovable Cloud: las funciones no verifican la sesión en la entrada
# (verify_jwt = false) y cada una valida al usuario dentro de su código.
# Se revisa en la fase 3.
# create-platform-admin y create-jefe-ventas no se publican (ver docs/BUILD_LOG.md).

[functions.create-tenant-user]
verify_jwt = false

[functions.list-tenant-users]
verify_jwt = false

[functions.loyalty-status]
verify_jwt = false

[functions.process-payment]
verify_jwt = false

[functions.reconcile-payments]
verify_jwt = false

[functions.refund-payment]
verify_jwt = false

[functions.register-seller]
verify_jwt = false

[functions.register-waiter]
verify_jwt = false

[functions.support-chat]
verify_jwt = false

# ─────────────────────────────────────────────────────────────────────────────
# Auth. Copia la configuración real del proyecto (leída con `supabase config push`
# respondiendo "no") y cambia solo lo decidido. Antes de empujar cambios, revisar
# siempre la diferencia: printf 'n\n' | supabase config push
# ─────────────────────────────────────────────────────────────────────────────
[auth]
enabled = true
site_url = "https://table-tray-qr.vercel.app"
additional_redirect_urls = [
  "https://table-tray-qr.vercel.app/**",
  "https://*-felipes-projects-61bc49be.vercel.app/**",
  "http://localhost:8080/**",
  "http://localhost:8090/**",
  "http://127.0.0.1:3000",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Fase 1.3: el comensal entra como invitado (anónimo) y puede convertirse en cliente.
enable_anonymous_sign_ins = true
# Permite unir Google/Apple a la cuenta de un invitado sin perder lo que hizo.
enable_manual_linking = true
minimum_password_length = 6

[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
# Código de 6 dígitos (antes 8): más fácil de escribir en la mesa.
otp_length = 6
otp_expiry = 3600

